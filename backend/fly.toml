app = "streamvault-api"
primary_region = "sin" # Singapore - closest to Indonesia/Japan

[build]

[http_service]
    internal_port = 8079
    force_https = true
    auto_stop_machines = true
    auto_start_machines = true
    min_machines_running = 0 # Scale to zero when idle = cost efficient

    [http_service.concurrency]
    type = "connections"
    hard_limit = 200
    soft_limit = 150

[[vm]]
    memory = "256mb"
    cpu_kind = "shared"
    cpus = 1

# Environment variables - secrets are set via `fly secrets set`
[env]
    PORT = "8079"
    RUST_LOG = "streamvault_api=info,tower_http=info"